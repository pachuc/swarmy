# Library crates must not spawn fire-and-forget background tasks. Every
# spawn in library code is an owned, bounded task whose handle aborts it on
# drop, or whose lifetime is tied to a connection, run, or single flight.
# The rule matches `tokio::spawn`, `tokio::task::spawn`, and any one-argument
# `.spawn(task)` method call (`JoinSet::spawn`, `std::thread::Builder::spawn`);
# zero-argument `Command::spawn()` calls do not match. Each allowed spawn
# carries `// ast-grep-ignore: no-spawn-in-libraries` on its own line directly
# above the call, after a comment line saying who owns the task and what
# bounds it. Prefer restructuring so the caller drives the work. Test modules
# are excluded structurally; the shared `ignores:` list below (kept identical
# across rules by scripts/check-ast-grep-rules.sh) excludes binaries, entry
# points, and test files.
id: no-spawn-in-libraries
language: rust
severity: error
message: >-
  Spawning in library code needs an owned bounded task (a handle that aborts
  on drop, tied to a connection or run). Own the task and mark the call with
  an ast-grep-ignore comment and its reason, or restructure so the caller
  drives it.
rule:
  all:
    - any:
        - pattern: 'tokio::spawn($$$)'
        - pattern: 'tokio::task::spawn($$$)'
        - pattern: '$RECV.spawn($TASK)'
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                pattern: '#[cfg(test)]'
          stopBy: end
files:
  - 'crates/*/src/**/*.rs'
ignores:
  # Binaries own their process and output: spawning, printing, unwrapping,
  # and stringifying errors are unrestricted there.
  - 'crates/swarmy-cli/src/**'
  - 'crates/swarmy-chaos/src/**'
  - 'crates/swarmy-devtools/src/**'
  - 'crates/swarmy-scheduler/src/**'
  - 'crates/swarmy-worker/src/**'
  # swarmyd counts as a binary: its lib.rs declares no modules and its code
  # lives in the binary (see scripts/check-anyhow-in-libraries.sh).
  - 'crates/swarmyd/src/**'
  # Service entry points assemble connections, own their tasks, and report
  # startup failures.
  - '**/main.rs'
  # Test files, and the test-only support module compiled only for tests
  # (`cfg(any(test, feature = "test-support"))`).
  - '**/tests/**'
  - '**/tests.rs'
  - '**/*tests.rs'
  - 'crates/swarmy-core/src/test_support.rs'
