# Library error types stay typed so callers can match on them. The rule
# matches `.map_err(|e| e.to_string())`, `.map_err(ToString::to_string)`, and
# `.map_err(|e| format!(..))`, which all erase the error to text. A site
# where a String schema or the model needs the text carries
# `// ast-grep-ignore: no-stringified-errors` on its own line directly above
# it, after a comment line naming that schema. Otherwise add a thiserror
# variant. Test modules are excluded structurally; the shared `ignores:` list
# below (kept identical across rules by scripts/check-ast-grep-rules.sh)
# excludes binaries, entry points, and test files.
id: no-stringified-errors
language: rust
severity: error
message: >-
  Do not erase a library error type to text with map_err; add a thiserror
  variant so callers keep matching on it. Only a marked tool-result or
  schema-boundary site may hand text to the model or operator.
rule:
  all:
    - any:
        - pattern: '$X.map_err(|$E| $E.to_string())'
        - pattern: '$X.map_err(ToString::to_string)'
        - pattern: '$X.map_err(|$E| format!($$$))'
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                pattern: '#[cfg(test)]'
          stopBy: end
files:
  - 'crates/*/src/**/*.rs'
ignores:
  # Binaries own their process and output: spawning, printing, unwrapping,
  # and stringifying errors are unrestricted there.
  - 'crates/swarmy-cli/src/**'
  - 'crates/swarmy-chaos/src/**'
  - 'crates/swarmy-devtools/src/**'
  - 'crates/swarmy-scheduler/src/**'
  - 'crates/swarmy-worker/src/**'
  # swarmyd counts as a binary: its lib.rs declares no modules and its code
  # lives in the binary (see scripts/check-anyhow-in-libraries.sh).
  - 'crates/swarmyd/src/**'
  # Service entry points assemble connections, own their tasks, and report
  # startup failures.
  - '**/main.rs'
  # Test files, and the test-only support module compiled only for tests
  # (`cfg(any(test, feature = "test-support"))`).
  - '**/tests/**'
  - '**/tests.rs'
  - '**/*tests.rs'
  - 'crates/swarmy-core/src/test_support.rs'
