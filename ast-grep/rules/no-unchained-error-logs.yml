# Logged errors keep their cause chain: a tracing macro logs an error as
# `error = %swarmy_core::error_chain(&error)`, never `%error`, `?error`,
# `error = %error`, or `{error}` in the message, which print only the top
# message. Tests are out of scope. A value that is not an error (process
# output, a stored String) gets a name that is not `error`/`err`/`*_error`.
# A site that genuinely needs an exception carries
# `// ast-grep-ignore: no-unchained-error-logs` on the line above it, after a
# comment giving the reason. The shared `ignores:` list below (kept identical
# across rules by scripts/check-ast-grep-rules.sh) excludes binaries, entry
# points, and test files.
id: no-unchained-error-logs
language: rust
severity: error
message: >-
  Log errors with error = %swarmy_core::error_chain(&error) so the cause
  chain reaches the log.
rule:
  all:
    - kind: macro_invocation
    - regex: '^(?:tracing::)?(?:error|warn|info|debug|trace)!'
    - any:
        - regex: '[(,]\s*[%?](?:[a-z_]+_)?(?:error|err)\b'
        - regex: '\{(?:[a-z_]+_)?(?:error|err)(?::\?)?\}'
        - all:
            - regex: '\b(?:error|err|[a-z_]+_error)\s*=\s*[%?]'
            - not:
                regex: '\b(?:error|err|[a-z_]+_error)\s*=\s*%(?:swarmy_core|crate)::error_chain\('
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                pattern: '#[cfg(test)]'
          stopBy: end
files:
  - 'crates/*/src/**/*.rs'
ignores:
  # Binaries own their process and output: spawning, printing, unwrapping,
  # and stringifying errors are unrestricted there.
  - 'crates/swarmy-cli/src/**'
  - 'crates/swarmy-chaos/src/**'
  - 'crates/swarmy-devtools/src/**'
  - 'crates/swarmy-scheduler/src/**'
  - 'crates/swarmy-worker/src/**'
  # swarmyd counts as a binary: its lib.rs declares no modules and its code
  # lives in the binary (see scripts/check-anyhow-in-libraries.sh).
  - 'crates/swarmyd/src/**'
  # Service entry points assemble connections, own their tasks, and report
  # startup failures.
  - '**/main.rs'
  # Test files, and the test-only support module compiled only for tests
  # (`cfg(any(test, feature = "test-support"))`).
  - '**/tests/**'
  - '**/tests.rs'
  - '**/*tests.rs'
  - 'crates/swarmy-core/src/test_support.rs'
