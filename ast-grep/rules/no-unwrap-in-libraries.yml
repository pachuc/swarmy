# Library code must not panic on `.unwrap()`: use `?` or an `expect`
# stating the invariant. Unit tests in `#[cfg(test)] mod ...` blocks are
# excluded structurally (the `stopBy` keeps the search going past the
# enclosing function); integration tests, test support, binaries, and entry
# points are excluded by the shared `ignores:` list below, which
# scripts/check-ast-grep-rules.sh keeps identical across all rules. A site
# that genuinely needs an exception carries
# `// ast-grep-ignore: no-unwrap-in-libraries` on the line above it, after a
# comment giving the reason. (`$X` is the receiver: ast-grep needs a complete
# call expression.)
id: no-unwrap-in-libraries
language: rust
severity: error
message: >-
  Do not unwrap in library code; propagate with ? or use expect with the
  invariant that makes the value present.
rule:
  all:
    - pattern: '$X.unwrap()'
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                pattern: '#[cfg(test)]'
          stopBy: end
files:
  - 'crates/*/src/**/*.rs'
ignores:
  # Binaries own their process and output: spawning, printing, unwrapping,
  # and stringifying errors are unrestricted there.
  - 'crates/swarmy-cli/src/**'
  - 'crates/swarmy-chaos/src/**'
  - 'crates/swarmy-devtools/src/**'
  - 'crates/swarmy-scheduler/src/**'
  - 'crates/swarmy-worker/src/**'
  # swarmyd counts as a binary: its lib.rs declares no modules and its code
  # lives in the binary (see scripts/check-anyhow-in-libraries.sh).
  - 'crates/swarmyd/src/**'
  # Service entry points assemble connections, own their tasks, and report
  # startup failures.
  - '**/main.rs'
  # Test files, and the test-only support module compiled only for tests
  # (`cfg(any(test, feature = "test-support"))`).
  - '**/tests/**'
  - '**/tests.rs'
  - '**/*tests.rs'
  - 'crates/swarmy-core/src/test_support.rs'
