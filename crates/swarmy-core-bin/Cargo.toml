# Library link args do not reach this final executable.
build = "../swarmy-store/build.rs"

[lints]
workspace = true

[[bin]]
name = "swarmy-core"
path = "src/main.rs"
# Avoid overwriting the swarmy_core library documentation.
doc = false

[dependencies]
