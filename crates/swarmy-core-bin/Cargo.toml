[package]
name = "swarmy-core-bin"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# Library link args do not reach this final executable.
build = "../swarmy-store/build.rs"

[lints]
workspace = true

[[bin]]
name = "swarmy-core"
path = "src/main.rs"
# Avoid overwriting the swarmy_core library documentation.
doc = false

[dependencies]
anyhow.workspace = true
swarmy-version.workspace = true
swarmy-scheduler.workspace = true
swarmy-worker.workspace = true
swarmy-gateway.workspace = true
swarmy-api.workspace = true
swarmy-node-api.workspace = true
swarmy-volume.workspace = true
swarmy-store.workspace = true
swarmy-config.workspace = true
swarmy-core.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
ulid.workspace = true
jiff.workspace = true
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
swarmy-store = { workspace = true, features = ["test-support"] }
swarmy-testkit.workspace = true
swarmy-volume = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
