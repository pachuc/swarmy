[package]
name = "swarmy-provisioner"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# Library link args do not reach this final executable.
build = "../swarmy-store/build.rs"
[package.metadata.swarmy]
entry-point = true
[lints]
workspace = true
[[bin]]
name = "swarmy-provisioner"
path = "src/main.rs"
[dependencies]
anyhow.workspace = true
jiff.workspace = true
object_store.workspace = true
serde_json.workspace = true
swarmy-cloud.workspace = true
swarmy-config.workspace = true
swarmy-core.workspace = true
swarmy-infra.workspace = true
swarmy-store.workspace = true
swarmy-version.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
[dev-dependencies]
swarmy-store = { workspace = true, features = ["test-support"] }
swarmy-testkit.workspace = true
tempfile.workspace = true
foundationdb.workspace = true
