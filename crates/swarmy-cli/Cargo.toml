[package]
name = "swarmy-cli"
default-run = "swarmy"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["remote"]
remote = ["dep:aws-config", "dep:aws-sdk-ec2", "dep:aws-sdk-ssm", "dep:aws-sdk-s3", "dep:aws-sdk-iam"]

[lints]
workspace = true

[[bin]]
name = "swarmy"
path = "src/main.rs"

# The client talks to the control plane API only. It links no database,
# message bus, or object store library, so it builds without libfdb_c.
[dependencies]
async-trait.workspace = true
swarmy-version.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-ec2 = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-iam = { workspace = true, optional = true }
shell-words.workspace = true
ratatui.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
futures-util.workspace = true
url.workspace = true
toml.workspace = true
serde.workspace = true
fs2.workspace = true
tempfile.workspace = true
rustix.workspace = true
swarmy-config.workspace = true
swarmy-client.workspace = true
swarmy-api-types.workspace = true
clap.workspace = true
swarmy-core.workspace = true
swarmy-image.workspace = true
anyhow.workspace = true
serde_json.workspace = true
swarmy-llm.workspace = true
tokio.workspace = true
tracing.workspace = true
jiff.workspace = true
ulid.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Unit tests in the chat client construct typed API errors; the binary itself
# talks HTTP only through swarmy-client.
reqwest.workspace = true
