[package]
build = "../swarmy-store/build.rs"
name = "swarmy-cli"
default-run = "swarmy"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "swarmy"
path = "src/main.rs"

[[bin]]
name = "swarmy-session"
