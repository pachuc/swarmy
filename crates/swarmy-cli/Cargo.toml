[package]
name = "swarmy-cli"
default-run = "swarmy"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Provisioning (EC2, SSM, S3, IAM) is opt-in so the default build skips the
# EC2 provisioning SDKs. Node builds and plain workspace checks use the default;
# laptop installs and provisioning tests enable `remote`.
default = ["azure", "bedrock", "gemini"]
remote = ["swarmy-cloud/remote"]
# The CLI probes every provider by default. Each cloud client forwards to the
# matching swarmy-llm feature; nothing else enables any.
azure = ["swarmy-llm/azure"]
bedrock = ["swarmy-llm/bedrock"]
gemini = ["swarmy-llm/gemini"]

[lints]
workspace = true

[[bin]]
name = "swarmy"
path = "src/main.rs"

# The remote suite drives provisioning commands, so it needs the EC2 SDKs and
# only builds when the `remote` feature is on. tests/remote_feature.rs covers
# the binary built without provisioning support and always builds.
[[test]]
name = "remote"
path = "tests/remote.rs"
required-features = ["remote"]

# The client talks to the control plane API only. It links no database,
# message bus, or object store library, so it builds without libfdb_c.
[dependencies]
async-trait.workspace = true
swarmy-version.workspace = true
swarmy-cloud.workspace = true
shell-words.workspace = true
ratatui.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
futures-util.workspace = true
url.workspace = true
toml.workspace = true
serde.workspace = true
fs2.workspace = true
tempfile.workspace = true
rustix.workspace = true
swarmy-config.workspace = true
swarmy-client.workspace = true
swarmy-api-types.workspace = true
clap.workspace = true
swarmy-core.workspace = true
swarmy-image.workspace = true
anyhow.workspace = true
serde_json.workspace = true
swarmy-llm.workspace = true
tokio.workspace = true
tracing.workspace = true
jiff.workspace = true
ulid.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Unit tests in the chat client construct typed API errors; the binary itself
# talks HTTP only through swarmy-client.
reqwest.workspace = true
