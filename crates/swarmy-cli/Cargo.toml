[package]
name = "swarmy-cli"
default-run = "swarmy"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Provisioning (EC2, SSM, S3, IAM) is opt-in so the default build skips the
# EC2 provisioning SDKs. Laptop installs enable `remote` and `chat`; node
# installs disable default features to omit terminal dependencies.
default = ["chat"]
chat = ["swarmy-chat/terminal", "dep:crossterm", "dep:unicode-width"]
remote = ["swarmy-cloud/remote"]

[lints]
workspace = true

[[bin]]
name = "swarmy"
path = "src/main.rs"

# The remote suite drives provisioning commands, so it needs the EC2 SDKs and
# only builds when the `remote` feature is on. tests/remote_feature.rs covers
# the binary built without provisioning support and always builds.
[[test]]
name = "remote"
path = "tests/remote.rs"
required-features = ["remote"]

# The client talks to the control plane API only. It links no database,
# message bus, or object store library, so it builds without libfdb_c.
[dependencies]
swarmy-version.workspace = true
swarmy-cloud.workspace = true
url.workspace = true
serde.workspace = true
fs2.workspace = true
rustix.workspace = true
swarmy-bus.workspace = true
swarmy-config.workspace = true
swarmy-client.workspace = true
swarmy-chat.workspace = true
swarmy-api-types.workspace = true
clap.workspace = true
crossterm = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
swarmy-core.workspace = true
swarmy-image.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
jiff.workspace = true
ulid.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The image test only polls for a spawned API with eventually(): no stack
# feature, so this test binary does not link the FoundationDB client (the
# remote-tests job has none). A direct path dependency because workspace
# inheritance cannot disable default features.
swarmy-testkit = { path = "../swarmy-testkit", version = "0.1.0", default-features = false }
