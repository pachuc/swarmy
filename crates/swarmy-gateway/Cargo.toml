[package]
build = "../swarmy-store/build.rs"
name = "swarmy-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# The gateway serves every provider by default. Each cloud client forwards to
# the matching swarmy-llm feature so --no-default-features builds refuse those
# providers with a clear error instead of failing to compile.
[features]
default = ["azure", "bedrock", "gemini"]
azure = ["swarmy-llm/azure"]
bedrock = ["swarmy-llm/bedrock"]
gemini = ["swarmy-llm/gemini"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
swarmy-version.workspace = true
swarmy-config.workspace = true
anyhow.workspace = true
async-stream.workspace = true
futures.workspace = true
jiff.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
swarmy-bus.workspace = true
swarmy-core.workspace = true
swarmy-llm = { workspace = true, features = ["fake"] }
swarmy-harness.workspace = true
blake3.workspace = true
swarmy-store.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
swarmy-store = { workspace = true, features = ["test-support"] }

wiremock.workspace = true
foundationdb.workspace = true
tempfile.workspace = true
