[package]
build = "../swarmy-store/build.rs"
name = "swarmy-volume"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Only kernel.rs opts into unsafe code for Linux NBD ioctls.
[lints]
workspace = true

# Test-only volume entry points used by integration tests across crates.
# Test crates enable it through dev-dependencies with no command change;
# unit tests inside this crate see the same functions through `cfg(test)`.
[features]
test-support = []

[dependencies]
async-trait.workspace = true
swarmy-config.workspace = true
swarmy-core.workspace = true
swarmy-image.workspace = true
swarmy-store.workspace = true
jiff.workspace = true
object_store.workspace = true
blake3.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

tokio.workspace = true
tracing.workspace = true
fs2.workspace = true
libc.workspace = true
ulid.workspace = true
futures.workspace = true
tempfile.workspace = true

[dev-dependencies]
swarmy-testkit.workspace = true
# The crate enables its own test-support feature for its integration tests,
# so `cargo test -p swarmy-volume` alone compiles the gated helpers without
# relying on other crates' dev-dependencies to unify the feature.
swarmy-volume = { path = ".", features = ["test-support"] }
async-trait.workspace = true
tracing-subscriber.workspace = true
# Only the S3 compatibility probe example uses these; the library never links
# the provisioning SDK or the argument parser.
aws-sdk-s3.workspace = true
clap.workspace = true
