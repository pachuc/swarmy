[package]
name = "swarmy-store"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Test-only store entry points used by integration tests across crates.
# Test crates enable it through dev-dependencies with no command change;
# unit tests inside this crate see the same functions through `cfg(test)`.
[features]
test-support = []

# The FoundationDB network boot function is the only local unsafe-code exception.
[dependencies]
chacha20poly1305.workspace = true
rand.workspace = true
swarmy-config.workspace = true
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
foundationdb.workspace = true
futures.workspace = true
jiff.workspace = true
object_store.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
swarmy-core.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio.workspace = true
ulid.workspace = true

[dev-dependencies]
chacha20poly1305.workspace = true
rand.workspace = true
# The crate enables its own test-support feature for its integration tests,
# so `cargo test -p swarmy-store` alone compiles the gated helpers without
# relying on other crates' dev-dependencies to unify the feature.
swarmy-store = { path = ".", features = ["test-support"] }
tempfile.workspace = true
swarmy-volume.workspace = true
