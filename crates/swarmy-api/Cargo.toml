[package]
name = "swarmy-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
build = "../swarmy-store/build.rs"

[lints]
workspace = true

# The model probe route builds clients for every provider, so the API forwards
# the same cloud features as the gateway and the CLI. A standalone build
# without a feature refuses those probes with a clear error.
[features]
default = ["azure", "bedrock", "gemini"]
azure = ["swarmy-llm/azure"]
bedrock = ["swarmy-llm/bedrock"]
gemini = ["swarmy-llm/gemini"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
axum.workspace = true
swarmy-api-types.workspace = true
swarmy-store.workspace = true
swarmy-core.workspace = true
swarmy-bus.workspace = true
swarmy-config.workspace = true
swarmy-image.workspace = true
swarmy-volume.workspace = true
object_store.workspace = true
tempfile.workspace = true
swarmy-llm = { workspace = true, features = ["fake"] }
swarmy-version.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
utoipa-swagger-ui = { workspace = true, features = ["vendored"] }
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
blake3.workspace = true
base64.workspace = true
futures.workspace = true
async-stream.workspace = true

[dev-dependencies]
swarmy-store = { workspace = true, features = ["test-support"] }
swarmy-testkit.workspace = true

swarmy-client.workspace = true
reqwest.workspace = true
foundationdb.workspace = true
object_store.workspace = true
unicode-width.workspace = true
