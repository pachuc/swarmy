[package]
name = "swarmy-cloud"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Bucket setup through the S3 SDK is opt-in so the default build skips the AWS SDK.
# The SSH helpers, the remote parser, bucket interface, and SSH boundary need no SDK.
default = []
remote = ["dep:aws-sdk-s3", "dep:swarmy-aws"]

[lints]
workspace = true

[dependencies]
aws-sdk-s3 = { workspace = true, optional = true }
swarmy-aws = { workspace = true, optional = true }
clap.workspace = true
fs2.workspace = true
jiff.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
swarmy-api-types.workspace = true
swarmy-client.workspace = true
swarmy-config.workspace = true
swarmy-infra.workspace = true
swarmy-core.workspace = true
swarmy-version.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
thiserror.workspace = true
ulid.workspace = true
url.workspace = true

[dev-dependencies]
# Light fixtures do not link FoundationDB.
swarmy-testkit = { path = "../swarmy-testkit", version = "0.1.0", default-features = false }
