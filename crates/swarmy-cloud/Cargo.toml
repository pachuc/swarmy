[package]
name = "swarmy-cloud"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Provisioning against EC2, SSM, S3, and IAM is opt-in so the default build
# skips the AWS SDKs entirely. The SSH helpers, the `remote` command parser,
# the provider interface, and the fake used by tests need no provider SDKs.
default = []
remote = ["dep:aws-config", "dep:aws-sdk-ec2", "dep:aws-sdk-ssm", "dep:aws-sdk-s3", "dep:aws-sdk-iam"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-ec2 = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-iam = { workspace = true, optional = true }
clap.workspace = true
fs2.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
swarmy-api-types.workspace = true
swarmy-client.workspace = true
swarmy-config.workspace = true
swarmy-core.workspace = true
swarmy-version.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true
url.workspace = true
