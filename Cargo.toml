[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
# Deny rather than forbid, so the two places that need unsafe code (the
# FoundationDB network boot in swarmy-store and the NBD ioctl wrapper in
# swarmy-volume) can opt back in per item with a reason and a SAFETY comment.
unsafe_code = "deny"
# Keep the public surface minimal and paths short. Both are fixed
# mechanically with `cargo fix`.
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_stack_frames = "deny"
# The sleep ban in clippy.toml applies to test targets only: each test root
# opts in with its own deny (workspace lints cannot be test-scoped, and
# production code sleeps legitimately in backoffs and intervals).
disallowed_methods = "allow"
# Every `allow` needs a reason. Prefer `expect`; `allow` stays legal for lints
# that fire under some feature combinations and not others.
allow_attributes_without_reason = "deny"
# `todo!`, `unimplemented!`, and `dbg!` never land in the tree.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Complexity and nesting are nursery lints that Clippy leaves off; their
# thresholds live in clippy.toml. `too_many_lines` (pedantic, 100 lines) and
# `too_many_arguments` (in `all`, 7 arguments) apply at Clippy's defaults.
cognitive_complexity = "deny"
excessive_nesting = "deny"
# Swallowed errors: best-effort ignores go through
# `swarmy_core::ignore_best_effort`, which logs the failure at debug.
# `map_err_ignore` stays allowed: those sites translate a low-level error into
# a domain error, and naming the discarded source at each one would be noise.
let_underscore_must_use = "deny"
unused_result_ok = "deny"

[workspace.dependencies]
swarmy-version = { path = "crates/swarmy-version" }
# Every TLS client in the workspace uses ring as its only crypto provider, so
# the C-based aws-lc backend is never compiled. reqwest's `rustls-tls`,
# async-nats' `ring`, and object_store's `aws` (via reqwest) already select
# ring. The AWS SDKs need explicit flavors: aws-config's `rustls` alias pulls
# the default HTTPS client built on aws-lc, so it uses `legacy-client` (the
# ring-based connector) instead; the generated SDKs' `rustls` feature is that
# same ring connector, without the aws-lc default client.
aws-config = { version = "1", default-features = false, features = ["legacy-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-types = { version = "1", default-features = false }
# The provisioning SDKs stay out of the default build (swarmy-cli gates them
# behind its opt-in `remote` feature) and skip the aws-lc default HTTPS
# client. S3 keeps `sigv4a` and `http-1x` from its defaults; the other three
# SDKs' defaults add nothing beyond `rustls` and `rt-tokio`.
aws-sdk-ec2 = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "sigv4a", "http-1x"] }
aws-sdk-iam = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
portable-pty = "0.9"
vt100 = "0.16"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
anyhow = "1"
axum = "0.8"
tower = "0.5"
swarmy-api-types = { path = "crates/swarmy-api-types" }
swarmy-client = { path = "crates/swarmy-client" }
swarmy-chat = { path = "crates/swarmy-chat" }
async-nats = { version = "0.49", features = ["ring"] }
async-stream = "0.3"
async-trait = "0.1"
chacha20poly1305 = "0.10"
base64 = "0.22"
sha2 = "0.10"
fs2 = "0.4"
futures = "0.3"
rand = "0.9"
rand_chacha = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
wiremock = "0.6"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
url = "2"
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
jiff = { version = "0.2", features = ["serde"] }
foundationdb = { version = "0.9", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
object_store = { version = "0.12", features = ["aws"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
utoipa = "5"
# Vendored Swagger UI embeds the viewer at build time: the default features
# would download it from GitHub with system curl on every cold build, which
# --locked does not cover and offline node builds cannot reach.
utoipa-swagger-ui = { version = "9", features = ["axum"], default-features = false }
thiserror = "2"
toml = "0.8"
shell-words = "1"
rustix = { version = "1", features = ["time"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
swarmy-api = { path = "crates/swarmy-api" }
swarmy-catalog = { path = "crates/swarmy-catalog" }
swarmy-config = { path = "crates/swarmy-config" }
swarmy-core = { path = "crates/swarmy-core" }
swarmy-image = { path = "crates/swarmy-image" }
swarmy-bus = { path = "crates/swarmy-bus" }
swarmy-cloud = { path = "crates/swarmy-cloud" }
# Dependents get no swarmy-llm default features. swarmy-api and swarmy-gateway
# turn the cloud providers back on through their own default features (for
# direct model probes and inference); every other crate needs only model
# metadata and the offline protocols, not the cloud SDKs.
swarmy-llm = { path = "crates/swarmy-llm", default-features = false }
swarmy-sandbox = { path = "crates/swarmy-sandbox" }
swarmy-volume = { path = "crates/swarmy-volume" }
swarmy-store = { path = "crates/swarmy-store" }
swarmy-tools = { path = "crates/swarmy-tools" }
swarmy-testkit = { path = "crates/swarmy-testkit" }
swarmy-harness = { path = "crates/swarmy-harness" }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3

# Generated AWS clients need substantial memory; omit their debug info and
# optimization in development builds so local and CI builds remain practical.
[profile.dev.package.aws-sdk-ec2]
opt-level = 0
debug = false

[profile.dev.package.aws-sdk-ssm]
opt-level = 0
debug = false

# EC2 calls are infrequent and network bound. Avoid optimizing its generated
# client so release builds fit on the four-core development node too.
[profile.release.package.aws-sdk-ec2]
opt-level = 0

# Bedrock is network bound; keep its generated client inexpensive to build.
[profile.dev.package.aws-sdk-bedrockruntime]
opt-level = 0
debug = false
