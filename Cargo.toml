[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
# Deny rather than forbid: the volume and sandbox crates must speak to kernel
# block-device and VM interfaces and opt back in per module with a justification.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_stack_frames = "deny"

[workspace.dependencies]
anyhow = "1"
async-nats = "0.49"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
fs2 = "0.4"
futures = "0.3"
rand = "0.9"
rand_chacha = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
wiremock = "0.6"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde"] }
foundationdb = { version = "0.9", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
object_store = { version = "0.12", features = ["aws"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "0.8"
shell-words = "1"
rustix = { version = "1", features = ["time"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
swarmy-config = { path = "crates/swarmy-config" }
swarmy-core = { path = "crates/swarmy-core" }
swarmy-bus = { path = "crates/swarmy-bus" }
swarmy-llm = { path = "crates/swarmy-llm" }
swarmy-store = { path = "crates/swarmy-store" }
swarmy-harness = { path = "crates/swarmy-harness" }

[profile.dev.package."*"]
opt-level = 3
