[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
# Deny rather than forbid: the volume and sandbox crates must speak to kernel
# block-device and VM interfaces and opt back in per module with a justification.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_stack_frames = "deny"

[workspace.dependencies]
swarmy-gateway = { path = "crates/swarmy-gateway" }
swarmy-version = { path = "crates/swarmy-version" }
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-types = { version = "1", default-features = false }
aws-sdk-ec2 = "1"
aws-sdk-ssm = "1"
portable-pty = "0.9"
vt100 = "0.16"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
anyhow = "1"
async-nats = "0.49"
async-stream = "0.3"
async-trait = "0.1"
chacha20poly1305 = "0.10"
base64 = "0.22"
sha2 = "0.10"
fs2 = "0.4"
futures = "0.3"
httpdate = "1"
rand = "0.9"
rand_chacha = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
wiremock = "0.6"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
libloading = "0.8"
libc = "0.2"
url = "2"
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
jiff = { version = "0.2", features = ["serde"] }
foundationdb = { version = "0.9", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
object_store = { version = "0.12", features = ["aws"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
utoipa = "5"
thiserror = "2"
toml = "0.8"
shell-words = "1"
rustix = { version = "1", features = ["time"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
swarmy-config = { path = "crates/swarmy-config" }
swarmy-core = { path = "crates/swarmy-core" }
swarmy-bus = { path = "crates/swarmy-bus" }
swarmy-llm = { path = "crates/swarmy-llm" }
swarmy-sandbox = { path = "crates/swarmy-sandbox" }
swarmy-volume = { path = "crates/swarmy-volume" }
swarmy-store = { path = "crates/swarmy-store" }
swarmy-tools = { path = "crates/swarmy-tools" }
swarmy-harness = { path = "crates/swarmy-harness" }

[profile.dev.package."*"]
opt-level = 3

# Generated AWS clients need substantial memory; omit their debug info and
# optimization in development builds so local and CI builds remain practical.
[profile.dev.package.aws-sdk-ec2]
opt-level = 0
debug = false

[profile.dev.package.aws-sdk-ssm]
opt-level = 0
debug = false

# EC2 calls are infrequent and network bound. Avoid optimizing its generated
# client so release builds fit on the four-core development node too.
[profile.release.package.aws-sdk-ec2]
opt-level = 0

# Bedrock is network bound; keep its generated client inexpensive to build.
[profile.dev.package.aws-sdk-bedrockruntime]
opt-level = 0
debug = false
