# Fixed sleeps in tests hide timing assumptions: a suite that sleeps past a
# lease passes on fast machines and flakes on slow ones. Test code polls
# with `swarmy_testkit::eventually` instead, which names the awaited
# condition and fails loudly on timeout. Each test target opts into the ban
# with `#![deny(clippy::disallowed_methods)]` at its root (workspace lints
# cannot be test-scoped, and production code sleeps legitimately). A test
# whose assertion *is* silence over a window (quiescence over a redelivery
# interval, a genuinely slow tool) keeps its sleep with an `expect` and a
# reason.
disallowed-methods = [
  { path = "tokio::time::sleep", reason = "use swarmy_testkit::eventually instead of fixed sleeps in tests" },
  { path = "std::thread::sleep", reason = "use swarmy_testkit::eventually instead of fixed sleeps in tests" },
]
