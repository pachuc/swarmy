# Dependency policy for all workspace members and features.
[graph]
all-features = true

[advisories]
# Existing transitive advisories are tracked until upstream upgrades land.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
    { id = "RUSTSEC-2026-0098", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
    { id = "RUSTSEC-2026-0099", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
    { id = "RUSTSEC-2026-0104", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
    { id = "RUSTSEC-2026-0194", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
    { id = "RUSTSEC-2026-0195", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
    { id = "RUSTSEC-2026-0258", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
    { id = "RUSTSEC-2026-0285", reason = "Existing transitive dependency; upgrade requires upstream major-version migration" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "OpenSSL", "MPL-2.0", "Unlicense", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
