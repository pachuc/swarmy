# Dependency policy for all workspace members and features.
[graph]
all-features = true

[advisories]
# Each ignore names the affected line, why it is reachable, and what unblocks
# the upgrade. Re-check on every lock refresh; drop the entry once resolved.
ignore = [
    # Marvin timing side channel in rsa 0.9.10. It reaches the tree only as a
    # swarmy-llm dev-dependency for test JWT fixtures (no normal-edge parent);
    # production TLS never links rsa, and upstream ships no patched release.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 is dev-only test fixtures, never production TLS; no patched release upstream" },
    # Quadratic duplicate-attribute check in quick-xml 0.38.4, reached via
    # object_store 0.12 parsing S3 XML from our own SeaweedFS or cloud
    # endpoints. Upgrade to >= 0.41 waits on object_store moving past 0.12.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 parses only our own S3 endpoints via object_store 0.12; upgrade waits on object_store" },
    # Namespace memory exhaustion in quick-xml 0.38.4. Same reachability and
    # upgrade path as RUSTSEC-2026-0194 above.
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4 parses only our own S3 endpoints via object_store 0.12; upgrade waits on object_store" },
    # pin-utils 0.1.0 is unmaintained (repository archived 2026-10-01), not a vulnerability.
    # aws-smithy-http, aws-smithy-runtime, and aws-smithy-types pull it in directly.
    # Added 2026-11-13; re-check on each lock refresh and drop once the AWS SDK
    # crates stop depending on pin-utils.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.0 is unmaintained, not vulnerable; re-check each lock refresh and drop when AWS SDK dependencies remove it" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "OpenSSL", "MPL-2.0", "Unlicense", "CDLA-Permissive-2.0"]

[bans]
# Duplicate transitive versions are common in the AWS SDK and TLS trees.
# Keep them visible without blocking unrelated changes until upstream
# dependency trees converge.
multiple-versions = "warn"
# Wildcard requirements let a fresh resolve silently cross a major version.
# Warn so any new wildcard is noticed; deny once the tree is fully pinned.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
