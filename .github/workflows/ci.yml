name: CI
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: scripts/check-public-ids.sh
      - run: cargo fmt --all --check
      - run: cargo build --locked -p swarmy-cli --no-default-features
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --locked -p swarmy-cloud --features remote --all-targets -- -D warnings
      - run: cargo clippy --locked -p swarmy-cli --features remote --all-targets -- -D warnings
      - run: cargo test --locked -p swarmy-llm --no-default-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo machete
  workspace-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: ./.github/actions/install-dev-services
      - name: Start development services
        run: |
          scripts/dev-stack.sh start
          source .dev/env
          for name in SWARMY_FDB_CLUSTER_FILE SWARMY_NATS_URL SWARMY_S3_ENDPOINT SWARMY_S3_ACCESS_KEY SWARMY_S3_SECRET_KEY SWARMY_S3_BUCKET SWARMY_S3_REGION; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --exclude swarmy-e2e
      - name: Stop development services
        if: always()
        run: |
          scripts/dev-stack.sh stop
          scripts/dev-stack.sh status
  e2e-and-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-and-chaos
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: ./.github/actions/install-dev-services
      - name: Start development services
        run: |
          scripts/dev-stack.sh start
          source .dev/env
          for name in SWARMY_FDB_CLUSTER_FILE SWARMY_NATS_URL SWARMY_S3_ENDPOINT SWARMY_S3_ACCESS_KEY SWARMY_S3_SECRET_KEY SWARMY_S3_BUCKET SWARMY_S3_REGION; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - run: cargo build --workspace --locked
      - run: cargo test --locked -p swarmy-e2e --test gateway --test scheduler --test worker -- --test-threads=1
      - run: scripts/chaos-ci.sh
      - name: Stop development services
        if: always()
        run: |
          scripts/dev-stack.sh stop
          scripts/dev-stack.sh status
  cli-session:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-session
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: ./.github/actions/install-dev-services
      - name: Start development services
        run: |
          scripts/dev-stack.sh start
          source .dev/env
          for name in SWARMY_FDB_CLUSTER_FILE SWARMY_NATS_URL SWARMY_S3_ENDPOINT SWARMY_S3_ACCESS_KEY SWARMY_S3_SECRET_KEY SWARMY_S3_BUCKET SWARMY_S3_REGION; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - run: cargo build --workspace --locked
      - run: cargo test --locked -p swarmy-e2e --test cli_session -- --test-threads=1
      - name: Stop development services
        if: always()
        run: |
          scripts/dev-stack.sh stop
          scripts/dev-stack.sh status
  remote-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: remote-tests
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked -p swarmy-cloud --features remote
      - run: cargo test --locked -p swarmy-cli --features remote -- --skip dev_up_run_recover_reconfigure_and_down
  openapi-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check OpenAPI compatibility
        run: scripts/check-openapi-compat.sh origin/master
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-scripts.sh
