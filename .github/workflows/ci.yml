name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: scripts/check-public-ids.sh
      - run: scripts/check-anyhow-in-libraries.sh
      - run: npx --yes @ast-grep/cli@0.45.3 scan --config ast-grep/sgconfig.yml
      - run: cargo fmt --all --check
      - run: cargo build --locked -p swarmy-cli --no-default-features
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --locked -p swarmy-cloud --features remote --all-targets -- -D warnings
      - run: cargo clippy --locked -p swarmy-cli --features remote --all-targets -- -D warnings
      - run: cargo test --locked -p swarmy-llm --no-default-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
  workspace-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: ./.github/actions/install-dev-services
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --exclude swarmy-e2e
      - name: Stop development services
        if: always()
        uses: ./.github/actions/install-dev-services
        with:
          mode: stop
  e2e-and-chaos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-and-chaos
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: ./.github/actions/install-dev-services
      - run: cargo build --workspace --locked
      - run: cargo test --locked -p swarmy-e2e --test gateway --test scheduler --test worker -- --test-threads=1
      - run: scripts/chaos-ci.sh
      - name: Stop development services
        if: always()
        uses: ./.github/actions/install-dev-services
        with:
          mode: stop
  cli-session:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-session
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: ./.github/actions/install-dev-services
      - run: cargo build --workspace --locked
      - run: cargo test --locked -p swarmy-e2e --test cli_session -- --test-threads=1
      - name: Stop development services
        if: always()
        uses: ./.github/actions/install-dev-services
        with:
          mode: stop
  remote-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: remote-tests
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked -p swarmy-cloud --features remote
      - run: cargo test --locked -p swarmy-cli --features remote -- --skip dev_up_run_recover_reconfigure_and_down
  openapi-compat:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check OpenAPI compatibility
        run: scripts/check-openapi-compat.sh origin/master
  script-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dev-services
        with:
          mode: install
      - run: scripts/test-scripts.sh
  dependency-policy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo deny check licenses bans sources
      - run: cargo machete
  clone-report:
    # Advisory only: clone detectors are fuzzy, so a threshold gate would get
    # gamed. Reviewers use the published numbers with REVIEWER.md's
    # duplication checklist. Runs in parallel and finishes in about a minute,
    # far inside the longest CI job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clone report
        run: |
          npx --yes jscpd@5.3.3 --config .jscpd.json
          python3 - >>"$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          report = json.load(open("target/jscpd/jscpd-report.json"))
          total = report["statistics"]["total"]
          print("## Clone report (advisory)")
          print()
          print(f"Rust production code (tests and generated code excluded): {total['sources']} files, {total['lines']} lines.")
          print(f"Exact clones over 20 lines: {total['clones']}, {total['duplicatedLines']} duplicated lines ({total['percentage']:.2f}%).")
          print()
          print("Advisory only: reviewers use this with REVIEWER.md's duplication checklist; the job never blocks.")
          print()
          dupes = sorted(report["duplicates"], key=lambda clone: -clone["lines"])[:10]
          if dupes:
              print("| Lines | First location | Second location |")
              print("| --- | --- | --- |")
              for clone in dupes:
                  first, second = clone["firstFile"], clone["secondFile"]
                  print(f"| {clone['lines']} | `{first['name']}:{first['start']}-{first['end']}` | `{second['name']}:{second['start']}-{second['end']}` |")
          else:
              print("No clones over 20 lines.")
          EOF
  advisories:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories
