name: Pull request CI
on:
  pull_request:

# GitHub concurrency has only one grouping dimension. A single shared group
# serializes all PRs because their root suites use the same host ports.
concurrency:
  group: swarmy-ci-pr-ports
  cancel-in-progress: false

jobs:
  linux:
    concurrency:
      group: swarmy-ci-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: [self-hosted, swarmy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Report persistent build cache size
        run: du -sh "$CARGO_TARGET_DIR" || true
      - name: Check formatting before starting services
        run: cargo fmt --all --check
      - name: Start development services
        run: |
          scripts/dev-stack.sh start
          source .dev/env
          for name in SWARMY_FDB_CLUSTER_FILE SWARMY_NATS_URL SWARMY_S3_ENDPOINT SWARMY_S3_ACCESS_KEY SWARMY_S3_SECRET_KEY SWARMY_S3_BUCKET SWARMY_S3_REGION; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      # The end-to-end suite spawns the real scheduler, worker, gateway, and
      # CLI binaries, so build the workspace first and run that suite on its
      # own: each of its tests spawns those services, and they starve each
      # other on the two-core runner when run in parallel.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --exclude swarmy-e2e
      - name: Run the end-to-end suite serially
        run: cargo test --locked -p swarmy-e2e -- --test-threads=1
      # The default build leaves the opt-in `remote` feature off, so the
      # workspace test and clippy runs never compile the provisioning client.
      # Build it once here and run its unit and integration tests and clippy
      # with the feature on.
      - name: Test the cloud provisioning implementation
        run: cargo test --locked -p swarmy-cloud --features remote
      - name: Test the provisioning client
        run: cargo test --locked -p swarmy-cli --features remote
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint the cloud provisioning implementation
        run: cargo clippy --locked -p swarmy-cloud --features remote --all-targets -- -D warnings
      - name: Lint the provisioning client
        run: cargo clippy --locked -p swarmy-cli --features remote --all-targets -- -D warnings
      # The cloud provider gates must not rot: this build refuses Bedrock,
      # Gemini, and Azure with a clear error instead of failing to compile.
      - name: Test the inference clients without cloud features
        run: cargo test --locked -p swarmy-llm --no-default-features
      - name: Run the reduced failure-injection test
        run: scripts/chaos-ci.sh
      - name: Check OpenAPI compatibility
        run: scripts/check-openapi-compat.sh origin/master
      - name: Stop development services
        if: always()
        run: |
          scripts/dev-stack.sh stop
          scripts/dev-stack.sh status
  root-suites:
    needs: linux
    runs-on: [self-hosted, swarmy-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Report persistent build cache size
        run: du -sh "$CARGO_TARGET_DIR" || true
      - name: Start development services
        run: |
          scripts/dev-stack.sh start
          source .dev/env
          for name in SWARMY_FDB_CLUSTER_FILE SWARMY_NATS_URL SWARMY_S3_ENDPOINT SWARMY_S3_ACCESS_KEY SWARMY_S3_SECRET_KEY SWARMY_S3_BUCKET SWARMY_S3_REGION; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - name: Build test siblings
        run: cargo build --workspace --locked
      - name: Run root acceptance suites
        run: scripts/ci-root-suites.sh
      - name: Stop development services
        if: always()
        run: |
          scripts/dev-stack.sh stop
          scripts/dev-stack.sh status
